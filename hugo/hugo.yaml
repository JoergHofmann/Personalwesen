baseURL: @(Projekt.hugo.baseURL)
languageCode: de-DE

params:
    BookSection: 'docs'
    contact:
      email: @(Autor.mail)
      phone: @(Autor.tel)
    logo:
       direction: column
       src: /images/@(Projekt.logo)

title: @(Projekt.title)
subtitle: @(Projekt.subtitle)

module:
  imports:
  - path: @(Projekt.hugo.themeURL)

contentTypes:
  text/markdown: {}
  text/pandoc: {}
markup:
  defaultMarkdownHandler: "pandoc"

security:
  exec:
    allow:
        - '^pandoc$'
        - '^go$'

